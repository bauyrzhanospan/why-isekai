# GoReleaser v2: static binaries for every platform agents run on.
version: 2

project_name: why-isekai

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: isekai
    main: ./cmd/isekai
    binary: isekai
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: default
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    # isekai_<version>_<os>_<arch>; install.sh and the npm/PyPI packagers rely on this.
    name_template: "isekai_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - SPEC.md

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^ci:"
      - "^style:"

release:
  github:
    owner: bauyrzhanospan
    name: why-isekai

# Homebrew tap and Scoop bucket (roadmap task 11). They publish only when
# the tokens exist, so a release without them still succeeds.
#   brew install bauyrzhanospan/tap/why-isekai
#   scoop bucket add why-isekai https://github.com/bauyrzhanospan/scoop-bucket && scoop install why-isekai
brews:
  - name: why-isekai
    repository:
      owner: bauyrzhanospan
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_TOKEN" }}false{{ else }}true{{ end }}'
    directory: Formula
    homepage: https://github.com/bauyrzhanospan/why-isekai
    description: Project memory for AI agents, kept in git
    license: MIT
    install: |
      bin.install "isekai"
    test: |
      system "#{bin}/isekai", "version"

scoops:
  - name: why-isekai
    repository:
      owner: bauyrzhanospan
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    skip_upload: '{{ if index .Env "SCOOP_BUCKET_TOKEN" }}false{{ else }}true{{ end }}'
    homepage: https://github.com/bauyrzhanospan/why-isekai
    description: Project memory for AI agents, kept in git
    license: MIT
