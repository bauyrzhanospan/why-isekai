name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -count=1 ./...
      - name: build all targets
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/isekai
          done
      - name: packagers
        if: matrix.os == 'ubuntu-latest'
        run: |
          node packaging/npm/build.mjs --self-test
          python3 packaging/pypi/build_wheels.py --self-test
          python3 bench/run.py --self-test

  # Eat our own dog food: every commit in a PR must follow the spec,
  # checked by this repository's own GitHub Action built from source.
  journal:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: ./
        with:
          version: source
          strict: "true"
